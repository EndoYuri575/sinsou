<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>真相</title>

<!-- フォント読み込み（ネット上のGoogle Fontsを使用） -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&display=swap" rel="stylesheet">

<!-- 見た目の設定はすべて style.css に書いてあります -->
<link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ▼ .stage = 背面に重なっているオレンジの紙2枚（CSSの ::before / ::after で描画） -->
  <main class="stage">

    <!-- ▼ .paper = 手前のクリーム色の紙 -->
    <article class="paper">

      <!-- ▼ 見出し -->
      <h1>真相</h1>

      <!-- ▼ 本文。<p> 〜 </p> が1段落。ここの文章を書き換えれば内容を変えられます。
           <ruby>漢字<rt>ふりがな</rt></ruby> でふりがなが付きます。 -->
      <div class="body">

        <p>じつは、ずっとむかしにも、まったく同じ道すじを通って、この星に<ruby>宇宙船<rt>うちゅうせん</rt></ruby>が落ちていた。

        その船に乗っていたのは、今回いっしょに来ていた<ruby>宇宙飛行士<rt>うちゅうひこうし</rt></ruby>・<span class="name">星野</span>さんの、お父さんだった。

        お父さんの日記には、「<ruby>隕石<rt>いんせき</rt></ruby>を引きよせてしまう道すじがある」と書きのこされていた。</p>

        <p>今回の<ruby>事故<rt>じこ</rt></ruby>と、むかしの事故を調べてみると——</p>
        <p>見つけた<ruby>軌道図<rt>きどうず</rt></ruby>にえがかれた二つの飛行ルートは、ぴったり重なっていた。</p>

      </div>
    </article>
  </main>

</body>
</html>
